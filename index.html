<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ganpati Darshan 2026</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Ganpati Darshan 2026</h1>

        <div class="subtitle">
            Ganpati Bappa Morya
        </div>

        <div class="darshan-box">
            Ganpati Darshan will appear here
        </div>

        <div class="camera-section">

            <h2>Join the Darshan</h2>

            <p>
                Sit comfortably and join the Darshan.
            </p>

            <p>
                Your camera helps the system recognize when you have arrived.
                Microphone is not required.
            </p>

            <button id="startButton">
                Start Darshan
            </button>
            
            <button id="stopButton" disabled>
                Stop Darshan
            </button>
            <br>

            <video id="visitorCamera" autoplay playsinline></video>

            <div class="message" id="message">
                Camera is not enabled.
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
